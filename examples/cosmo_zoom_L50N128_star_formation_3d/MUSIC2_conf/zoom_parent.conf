[setup]
boxlength          = 50  # in Mpc/h
zstart             = 99   # redshift of the initial conditions
levelmin           = 7    # minimum level of refinement
levelmin_TF        = 7    # minimum level of refinement for perturbation grid
levelmax           = 7    # maximum level of refinement
padding            = 8    # number of cells used for padding
ref_center         = 0.5, 0.5, 0.5
ref_extent         = 1., 1., 1.
align_top          = no
baryons            = no
use_2LPT           = no

[cosmology]
Omega_m            = 0.3121
Omega_L            = 0.6879
w_0                = -1.0
w_a                = 0.0
Omega_b            = 0.0486
H0                 = 67.51
sigma_8            = 0.815
n_s                = 0.961
transfer           = CLASS

[random]
seed[7]            = 12345
seed[8]            = 23456
seed[9]            = 34567
seed[10]           = 45678
seed[11]           = 56789
seed[12]           = 67890


[output]
## AREPO data format
## requires HDF5 installation and HDF5 enabled in Makefile
format            = arepo
filename          = ./L50_N128_z99_arepo.hdf5
arepo_unitlength  = 3.085678e24   # 1.0 Mpc in cm

