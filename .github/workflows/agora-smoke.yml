name: AGORA disc smoke test

# Build-and-run smoke test for the AGORA isolated-disc example
# (examples/agora_disc_star_formation_3d), which exercises the
# STARS/STAR_PARTICLES/WINDS/SUPERNOVAE feedback path this branch's GPU
# work will target. Unlike build.yml this actually runs the code, so it
# needs a Grackle build plus the external ICs/tables from get_ics.sh and
# get_tables.sh (see that example's README.md for details).
#
# Runs a short, CI-sized slice of the simulation (not the full ~500 Myr
# science run) by launching Arepo in the background, tailing its log for
# a target number of sync-points, then dropping a "stop" file in the
# output directory - Arepo checks for that at every sync-point
# (check_for_interruption_of_run() in src/main/run.c) and exits cleanly
# (exit code 0), writing a restart file on the way out.
#
# Two earlier approaches to bounding this run didn't work:
#   - A small TimeMax derived from a target step count times
#     MaxSizeTimestep: hierarchical/individual timestepping means the
#     number of sync-points per unit of simulated time isn't predictable
#     up front, so this raced through 700+ sync-points in 43 minutes
#     without approaching TimeMax.
#   - A fixed TimeLimitCPU (e.g. 60s): startup (reading the ICs, domain
#     decomposition, building the mesh/gravity tree) eats a large,
#     variable chunk of any fixed wall-clock budget, so a 60s budget
#     produced only 2 sync-points on one run.
# Watching the log for an actual sync-point count sidesteps both
# problems. This only checks that the run starts, advances for the
# targeted number of sync-points, and exits cleanly - it is not a
# physics regression test.
#
# Builds Grackle from the SOLAS fork (solas-sims/grackle) with CMake -
# the classic autotools ./configure build is deprecated upstream since
# 3.4 and scheduled for removal in 3.5.

on:
  push:
    branches: [pawsey-pulse-gpu]
  pull_request:
    branches: [pawsey-pulse-gpu]
  schedule:
    # Weekly full-depth run, since this job depends on external Dropbox
    # links that aren't under our control and we don't want every PR
    # blocked on their availability/latency.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      target_sync_points:
        description: 'Number of sync-points to advance before stopping the run cleanly'
        required: false
        default: '100'

env:
  # solas-sims/grackle has no tags yet, so pin to a commit on main for
  # reproducibility. Bump deliberately, not silently, when updating.
  GRACKLE_REPO: https://github.com/solas-sims/grackle.git
  GRACKLE_REF: 7fbc9bbbd132a12bfa2d6630a441e871d472535e
  GRACKLE_DIR: /home/runner/software/grackle_solas
  EXAMPLE_DIR: examples/agora_disc_star_formation_3d

jobs:
  agora-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran cmake pkg-config \
            libopenmpi-dev openmpi-bin \
            libgsl-dev \
            libhdf5-serial-dev \
            libfftw3-dev \
            libhwloc-dev \
            python3

      - name: Cache Grackle build
        id: cache-grackle
        uses: actions/cache@v4
        with:
          path: ${{ env.GRACKLE_DIR }}
          key: grackle-${{ env.GRACKLE_REF }}-${{ runner.os }}-v2

      - name: Build Grackle
        if: steps.cache-grackle.outputs.cache-hit != 'true'
        run: |
          git clone "${GRACKLE_REPO}" /tmp/grackle
          cd /tmp/grackle
          git checkout "${GRACKLE_REF}"
          cmake -DCMAKE_INSTALL_PREFIX="${GRACKLE_DIR}" -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build -j2
          cmake --install build

      - name: Cache AGORA ICs and tables
        id: cache-agora-data
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.EXAMPLE_DIR }}/ICs
            ${{ env.EXAMPLE_DIR }}/grackle_data
            ${{ env.EXAMPLE_DIR }}/star_tables
          key: agora-disc-data-v1

      - name: Download ICs and tables
        if: steps.cache-agora-data.outputs.cache-hit != 'true'
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          ./get_ics.sh
          ./get_tables.sh

      - name: Build Arepo (AGORA config)
        run: |
          make -j2 \
            CONFIG="${EXAMPLE_DIR}/Config.sh" \
            BUILD_DIR="${EXAMPLE_DIR}/build" \
            EXEC="${EXAMPLE_DIR}/Arepo" \
            GRACKLE_DIR="${GRACKLE_DIR}"

      - name: Prepare run directory
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          cp param.txt param_ci.txt
          mkdir -p output

      - name: Run AGORA disc smoke test
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          target="${{ github.event.inputs.target_sync_points }}"
          if [ -z "$target" ]; then
            # Keep pull_request/push runs quick; the weekly schedule
            # defaults to a deeper slice.
            if [ "${{ github.event_name }}" = "schedule" ]; then
              target=100
            else
              target=15
            fi
          fi
          # Generous outer bound in case the polling below never sees the
          # target (e.g. the run stalls): scale with the target so a
          # 100-sync-point schedule run isn't cut off early, floored so a
          # small PR target still gets a reasonable grace period. The
          # job's own timeout-minutes is the ultimate backstop.
          max_wait_seconds=$((target * 60))
          if [ "$max_wait_seconds" -lt 600 ]; then
            max_wait_seconds=600
          fi
          poll_interval=5

          echo "Targeting ${target} sync-point(s), polling every ${poll_interval}s, max wait ${max_wait_seconds}s"

          mpiexec --oversubscribe -np 2 ./Arepo ./param_ci.txt > run.log 2>&1 &
          arepo_pid=$!

          elapsed=0
          stop_requested=false
          while kill -0 "$arepo_pid" 2>/dev/null; do
            sleep "$poll_interval"
            elapsed=$((elapsed + poll_interval))
            sync_points=$(grep -c '^Sync-Point' run.log || true)

            if [ "$stop_requested" = false ] && [ "$sync_points" -ge "$target" ]; then
              echo "Reached ${sync_points} sync-point(s) after ${elapsed}s - requesting a clean stop."
              touch output/stop
              stop_requested=true
            fi

            if [ "$elapsed" -ge "$max_wait_seconds" ]; then
              echo "::error::Timed out after ${max_wait_seconds}s waiting for the run to reach ${target} sync-points (got ${sync_points})."
              kill "$arepo_pid" 2>/dev/null || true
              exit 1
            fi
          done

          exit_code=0
          wait "$arepo_pid" || exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "::error::Arepo exited with code ${exit_code}."
            exit "$exit_code"
          fi

      - name: Check the run advanced and stopped cleanly
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          # Expected, benign noise in run.log: derefinement can hit degenerate
          # slivers and print "WARNING: ... strange: fac=<tiny number>" from
          # voronoi_derefinement.c - pre-existing upstream code (2022, commit
          # 60bd71b) that deliberately warns and clamps rather than
          # terminating. Not a regression, not GPU-work-related - don't treat
          # it as a failure signal here.
          sync_points=$(grep -c '^Sync-Point' run.log || true)
          echo "Logged ${sync_points} sync-point(s)."
          if [ "$sync_points" -lt 5 ]; then
            echo "::error::Fewer than 5 sync-points logged - the run barely started."
            exit 1
          fi

          shopt -s nullglob
          snaps=(output/snap_*.hdf5)
          if [ ${#snaps[@]} -eq 0 ]; then
            echo "::error::No snapshots were written to output/"
            exit 1
          fi
          echo "Found ${#snaps[@]} snapshot(s): ${snaps[*]}"

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agora-smoke-output
          path: |
            ${{ env.EXAMPLE_DIR }}/output/
            ${{ env.EXAMPLE_DIR }}/param_ci.txt
            ${{ env.EXAMPLE_DIR }}/run.log
          retention-days: 7
