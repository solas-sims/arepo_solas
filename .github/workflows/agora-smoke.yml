name: AGORA disc smoke test

# Build-and-run smoke test for the AGORA isolated-disc example
# (examples/agora_disc_star_formation_3d), which exercises the
# STARS/STAR_PARTICLES/WINDS/SUPERNOVAE feedback path this branch's GPU
# work will target. Unlike build.yml this actually runs the code, so it
# needs a Grackle build plus the external ICs/tables from get_ics.sh and
# get_tables.sh (see that example's README.md for details).
#
# Runs a short, CI-sized slice of the simulation (not the full ~500 Myr
# science run) by overriding TimeLimitCPU to well under a minute of
# wall-clock time (enough for ~10-20 sync-points); Arepo checks that
# periodically and exits cleanly (exit code 0) once it's past ~85% of
# the budget, writing a restart file on the way out.
# A fixed number-of-steps cutoff (e.g. a small TimeMax) doesn't work here
# because hierarchical/individual timestepping means the number of
# sync-points per unit of simulated time isn't predictable up front - an
# earlier version of this workflow tried that and still racked up 700+
# sync-points before anyone noticed it wasn't going to finish.
# This only checks that the run starts, advances for a while, and exits
# cleanly - it is not a physics regression test.
#
# Builds Grackle from the SOLAS fork (solas-sims/grackle) with CMake -
# the classic autotools ./configure build is deprecated upstream since
# 3.4 and scheduled for removal in 3.5.

on:
  push:
    branches: [pawsey-pulse-gpu]
  pull_request:
    branches: [pawsey-pulse-gpu]
  schedule:
    # Weekly full-depth run, since this job depends on external Dropbox
    # links that aren't under our control and we don't want every PR
    # blocked on their availability/latency.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      run_seconds:
        description: 'Wall-clock seconds to let the run advance before stopping it cleanly'
        required: false
        default: '1800'

env:
  # solas-sims/grackle has no tags yet, so pin to a commit on main for
  # reproducibility. Bump deliberately, not silently, when updating.
  GRACKLE_REPO: https://github.com/solas-sims/grackle.git
  GRACKLE_REF: 7fbc9bbbd132a12bfa2d6630a441e871d472535e
  GRACKLE_DIR: /home/runner/software/grackle_solas
  EXAMPLE_DIR: examples/agora_disc_star_formation_3d

jobs:
  agora-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran cmake pkg-config \
            libopenmpi-dev openmpi-bin \
            libgsl-dev \
            libhdf5-serial-dev \
            libfftw3-dev \
            libhwloc-dev \
            python3

      - name: Cache Grackle build
        id: cache-grackle
        uses: actions/cache@v4
        with:
          path: ${{ env.GRACKLE_DIR }}
          key: grackle-${{ env.GRACKLE_REF }}-${{ runner.os }}-v2

      - name: Build Grackle
        if: steps.cache-grackle.outputs.cache-hit != 'true'
        run: |
          git clone "${GRACKLE_REPO}" /tmp/grackle
          cd /tmp/grackle
          git checkout "${GRACKLE_REF}"
          cmake -DCMAKE_INSTALL_PREFIX="${GRACKLE_DIR}" -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build -j2
          cmake --install build

      - name: Cache AGORA ICs and tables
        id: cache-agora-data
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.EXAMPLE_DIR }}/ICs
            ${{ env.EXAMPLE_DIR }}/grackle_data
            ${{ env.EXAMPLE_DIR }}/star_tables
          key: agora-disc-data-v1

      - name: Download ICs and tables
        if: steps.cache-agora-data.outputs.cache-hit != 'true'
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          ./get_ics.sh
          ./get_tables.sh

      - name: Build Arepo (AGORA config)
        run: |
          make -j2 \
            CONFIG="${EXAMPLE_DIR}/Config.sh" \
            BUILD_DIR="${EXAMPLE_DIR}/build" \
            EXEC="${EXAMPLE_DIR}/Arepo" \
            GRACKLE_DIR="${GRACKLE_DIR}"

      - name: Prepare short-run param file
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          time_limit_cpu="${{ github.event.inputs.run_seconds }}"
          if [ -z "$time_limit_cpu" ]; then
            # ~17-18 sync-points/minute observed on this example, so a
            # minute comfortably covers the 10-20 sync-points a PR/push
            # run needs; the weekly schedule defaults to a deeper slice.
            if [ "${{ github.event_name }}" = "schedule" ]; then
              time_limit_cpu=1800
            else
              time_limit_cpu=60
            fi
          fi
          echo "Running with TimeLimitCPU=${time_limit_cpu}s"
          cp param.txt param_ci.txt
          sed -i "s/^TimeLimitCPU .*/TimeLimitCPU                            ${time_limit_cpu}/" param_ci.txt
          mkdir -p output

      - name: Run AGORA disc smoke test
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          set -o pipefail
          mpiexec --oversubscribe -np 2 ./Arepo ./param_ci.txt 2>&1 | tee run.log

      - name: Check the run advanced and stopped cleanly
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: |
          # Expected, benign noise in run.log: derefinement can hit degenerate
          # slivers and print "WARNING: ... strange: fac=<tiny number>" from
          # voronoi_derefinement.c - pre-existing upstream code (2022, commit
          # 60bd71b) that deliberately warns and clamps rather than
          # terminating. Not a regression, not GPU-work-related - don't treat
          # it as a failure signal here.
          sync_points=$(grep -c '^Sync-Point' run.log || true)
          echo "Logged ${sync_points} sync-point(s)."
          if [ "$sync_points" -lt 5 ]; then
            echo "::error::Fewer than 5 sync-points logged - the run barely started."
            exit 1
          fi

          shopt -s nullglob
          snaps=(output/snap_*.hdf5)
          if [ ${#snaps[@]} -eq 0 ]; then
            echo "::error::No snapshots were written to output/"
            exit 1
          fi
          echo "Found ${#snaps[@]} snapshot(s): ${snaps[*]}"

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agora-smoke-output
          path: |
            ${{ env.EXAMPLE_DIR }}/output/
            ${{ env.EXAMPLE_DIR }}/param_ci.txt
            ${{ env.EXAMPLE_DIR }}/run.log
          retention-days: 7
